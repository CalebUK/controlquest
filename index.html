<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ControlQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Vercel Web Analytics (only active when served from Vercel) -->
<script>window.va = window.va || function(){ (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root{
    --chalk:#f4fff7; --sun:#ffc93c; --kit:#e8443a; --blue:#2f4fb5;
    --ink:#10261d; --page:#0f2c20; --card:#ffffff;
    --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --page:#08140f; --card:#12241c; --ink:#eaf7ee; }
  }
  :root[data-theme="dark"]{ --page:#08140f; --card:#12241c; --ink:#eaf7ee; }

  *{box-sizing:border-box;}
  html,body{overscroll-behavior:none;}          /* no pull-to-refresh mid-game */
  .stage,.field{
    user-select:none; -webkit-user-select:none; -ms-user-select:none;
    -webkit-user-drag:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;                          /* no pinch-zoom or scroll on the board */
  }
  .stage img,.stage svg{-webkit-user-drag:none;pointer-events:none;}
  .stage button{-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;background:var(--page);font-family:var(--font);color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:10px;
    min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .stage{width:100%;max-width:1180px;display:flex;flex-direction:column;
    align-items:center;gap:8px;}

  /* ---------- hud ---------- */
  .hud{display:flex;align-items:center;gap:12px;min-height:50px;width:100%;
    max-width:var(--boardw);margin:0 auto;}
  .hud-btn{border:none;background:var(--sun);color:#3a2a00;font-family:var(--font);
    font-weight:600;font-size:1.05rem;padding:10px 18px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 0 #d9a51f;transition:transform .08s ease;}
  .hud-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a51f;}
  .hud-btn[hidden]{display:none;}
  .hud-btn:focus-visible,.tile:focus-visible,.mode:focus-visible,.key:focus-visible,
  .clear-btn:focus-visible{outline:4px solid var(--chalk);outline-offset:3px;}
  .tally{flex:1;display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:700;color:var(--chalk);}
  .tally .pips{display:flex;gap:5px;flex-wrap:wrap;}
  .pip{width:14px;height:14px;border-radius:50%;background:var(--sun);opacity:.3;}
  .pip.done{opacity:1;}
  .mute{border:none;background:rgba(255,255,255,.14);color:var(--chalk);width:50px;height:50px;
    border-radius:50%;font-size:1.4rem;cursor:pointer;line-height:1;}
  .mute.off{opacity:.4;}

  /* ---------- field ---------- */
  /* the board keeps its 4:3 shape but grows to use whatever the screen allows */
  :root{ --boardw:min(1180px, calc((100dvh - 132px) * 4 / 3)); }
  .field{position:relative;width:100%;max-width:var(--boardw);margin:0 auto;
    aspect-ratio:4/3;border-radius:22px;overflow:hidden;
    box-shadow:inset 0 0 0 7px rgba(255,255,255,.4), 0 14px 40px rgba(0,0,0,.4);
    touch-action:none;
    background:repeating-linear-gradient(180deg,#3aa85c 0 9%,#339b53 9% 18%);}
  @media (max-width:640px){
    :root{ --boardw:min(100%, calc((100dvh - 128px) * 3 / 4)); }
    .field{aspect-ratio:3/4;}
  }

  .field[data-bg="home"]{background:linear-gradient(180deg,#3d86e0 0%,#1b4d9e 50%,#0c2a63 100%);}
  .field[data-bg="sonardeep"]{background:linear-gradient(180deg,#0c2b46 0%,#05121f 55%,#02070e 100%);}
  .field[data-bg="country"]{background:linear-gradient(180deg,#8fd0f0 0 34%,#7fb541 34% 100%);}
  .bglayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
  .bglayer .tw{animation:twinkle 2.6s ease-in-out infinite;}
  @keyframes twinkle{50%{opacity:.1;}}
  .bglayer .bub{animation:rise linear infinite;}
  @keyframes rise{to{transform:translateY(-120vh);}}
  .bglayer .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  .nudge{animation:nudgepulse .7s ease 3;}
  @keyframes nudgepulse{50%{filter:brightness(1.7) drop-shadow(0 0 14px #ffe27a);}}
  .field[data-bg="sea"]{background:linear-gradient(180deg,#2fb3d9 0%,#1275a8 55%,#08405f 100%);}
  .field[data-bg="farm"]{background:repeating-linear-gradient(180deg,#8dc24a 0 12%,#7fb541 12% 24%);}
  .field[data-bg="road"]{background:linear-gradient(90deg,#6f9a52 0 11%,#f2f2f2 11% 12.3%,#4a4a52 12.3% 87.7%,#f2f2f2 87.7% 89%,#6f9a52 89% 100%);}
  .roadlines{position:absolute;inset:0;display:none;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(180deg,rgba(255,255,255,.9) 0 34px,transparent 34px 80px),
      repeating-linear-gradient(180deg,rgba(255,255,255,.9) 0 34px,transparent 34px 80px);
    background-size:9px 80px, 9px 80px;
    background-repeat:repeat-y, repeat-y;
    background-position:37% 0px, 63% 0px;}
  .roadlines.on{display:block;}
  .field[data-bg="space"]{background:radial-gradient(circle at 30% 20%,#2a2060 0%,#100b2e 60%,#06041a 100%);}
  .field[data-bg="food"]{background:repeating-linear-gradient(90deg,#e9c79a 0 34px,#e3bf90 34px 68px);}
  .field[data-bg="dojo"]{background:linear-gradient(180deg,#f3e8d2 0 47%,#c08f57 47% 100%);}
  .field[data-bg="dino"]{background:linear-gradient(180deg,#f3b46c 0 44%,#7fa34a 44% 100%);}
  .field[data-bg="garden"]{background:linear-gradient(180deg,#9fd7f5 0 22%,#7cb342 22% 100%);}
  .field[data-bg="blanket"]{background:#d8433a;}
  .field[data-bg="dirt"]{background:#6d5133;}
  .field[data-bg="lava"]{background:linear-gradient(180deg,#d4501a 0%,#f08a2c 45%,#c43a12 100%);}

  /* football furniture */
  .arc,.halfway,.centre,.goal,.goal2,.runball{display:none;}
  .m-shoot .arc,.m-shoot .goal,.g-letters .goal,.g-letters .arc,
  .g-letters .halfway,.g-letters .centre,.g-letters .goal2,.g-letters .runball{display:block;}
  .arc{position:absolute;left:50%;top:16%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);
    border:6px solid rgba(255,255,255,.5);border-radius:50%;}
  .halfway{position:absolute;left:0;right:0;top:50%;height:6px;background:rgba(255,255,255,.5);}
  .centre{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);
    border:6px solid rgba(255,255,255,.5);border-radius:50%;}
  .netbg{background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 2px,transparent 2px 13px),
      repeating-linear-gradient(0deg,rgba(255,255,255,.34) 0 2px,transparent 2px 13px),
      rgba(10,40,25,.34);}
  .goal{position:absolute;top:0;left:50%;transform:translateX(-50%);width:46%;height:15%;min-height:62px;
    border:7px solid var(--chalk);border-top:none;border-radius:0 0 14px 14px;overflow:hidden;}
  .goal.ripple{animation:netwobble .5s ease;}
  @keyframes netwobble{0%{transform:translateX(-50%) scaleY(1);}30%{transform:translateX(-50%) scaleY(1.16);}
    60%{transform:translateX(-50%) scaleY(.96);}100%{transform:translateX(-50%) scaleY(1);}}
  .goal2{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:46%;height:15%;min-height:62px;
    border:7px solid var(--chalk);border-bottom:none;border-radius:14px 14px 0 0;}
  .keeper{position:absolute;bottom:6px;left:0;width:20%;height:64%;border-radius:10px 10px 6px 6px;
    background:var(--kit);box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);display:none;}
  .keeper.on{display:block;}
  .keeper::before{content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);
    width:26px;height:26px;border-radius:50%;background:#f6d3ae;}

  .player{position:absolute;left:0;top:0;width:54px;height:82px;border-radius:14px 14px 8px 8px;
    box-shadow:inset 0 -9px 0 rgba(0,0,0,.2), 0 8px 10px rgba(0,0,0,.25);display:none;will-change:transform;}
  .player::before{content:"";position:absolute;left:50%;top:-24px;transform:translateX(-50%);
    width:32px;height:32px;border-radius:50%;background:#f6d3ae;border:4px solid currentColor;}
  .defender{background:var(--blue);color:var(--blue);}
  .chaser{background:#7b2fb5;color:#7b2fb5;}
  .runner{background:var(--kit);color:var(--kit);}
  .stopper{background:var(--blue);color:var(--blue);}
  .player.on{display:block;}
  .player.lunge{animation:lunge .25s ease;}
  @keyframes lunge{50%{filter:brightness(1.4);}}
  .runball{position:absolute;left:0;top:0;width:38px;height:38px;will-change:transform;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));}
  .runball svg{width:100%;height:100%;display:block;}

  .ball{position:absolute;top:0;left:0;width:110px;height:110px;will-change:transform;cursor:pointer;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));touch-action:none;display:none;}
  .m-shoot .ball,.m-maze .ball,.g-penalty .ball{display:block;}
  .ball svg{width:100%;height:100%;display:block;pointer-events:none;}
  .ball.hover{filter:drop-shadow(0 8px 8px rgba(0,0,0,.3)) brightness(1.06);}
  .ball.ring::after{content:"";position:absolute;inset:-9px;border-radius:50%;
    border:5px dashed var(--sun);animation:spin 7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ball.gone{opacity:0;pointer-events:none;}

  .guide{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .aline{stroke:var(--sun);stroke-width:11;stroke-linecap:round;opacity:0;}
  .aline.on{opacity:.95;}

  /* maze */
  .maze{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.28));}
  .m-maze .maze{display:block;}
  .maze .wall{stroke:var(--chalk);stroke-width:7;stroke-linecap:round;opacity:.9;}
  .maze .target{fill:rgba(255,201,60,.5);}
  .maze .post{stroke:var(--chalk);stroke-width:6;fill:none;}
  .maze .startmark{fill:rgba(255,255,255,.12);stroke:var(--chalk);stroke-width:4;stroke-dasharray:7 7;opacity:.85;}

  /* arcade sprites */
  .sprites{position:absolute;inset:0;pointer-events:none;z-index:2;}
  .sprite svg,.hero svg{width:100%;height:100%;display:block;}
  .sprite .ic{display:flex;width:100%;height:100%;align-items:center;justify-content:center;}
  .sprite .ic svg{width:100%;height:100%;display:block;}
  .sprite{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
    line-height:1;user-select:none;will-change:transform;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));}
  .hero{position:absolute;left:0;top:0;display:none;align-items:center;justify-content:center;
    line-height:1;user-select:none;will-change:transform;z-index:3;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.4));}
  .hero.on{display:flex;}
  .hero.frozen{filter:grayscale(1) brightness(.75) drop-shadow(0 5px 5px rgba(0,0,0,.4));}
  .hero.hurt{animation:hurt .5s ease;}
  @keyframes hurt{0%,100%{filter:drop-shadow(0 5px 5px rgba(0,0,0,.4));}
    25%,75%{filter:brightness(2) drop-shadow(0 0 10px var(--kit));opacity:.5;}}

  .foodcard{position:absolute;left:14px;top:14px;display:none;z-index:4;
    flex-direction:column;align-items:center;gap:2px;
    background:var(--card);color:var(--ink);border-radius:18px;
    padding:8px 14px 10px;box-shadow:0 6px 0 rgba(0,0,0,.28);}
  .foodcard.on{display:flex;}
  .fc-label{font-size:.85rem;font-weight:600;color:#6d8a7b;line-height:1;}
  .fc-emoji{font-size:clamp(2.6rem,10vmin,4.2rem);line-height:1.05;}
  .fc-count{font-size:1.05rem;font-weight:700;line-height:1;}
  .foodcard.got .fc-emoji{animation:goodkey .3s ease;}
  .badge{position:absolute;left:14px;top:14px;background:rgba(0,0,0,.45);color:#fff;
    font-size:1.05rem;font-weight:600;padding:7px 15px;border-radius:999px;display:none;z-index:4;}
  .badge.on{display:block;}

  .lcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:clamp(110px,22vw,160px);aspect-ratio:1;border-radius:24px;background:var(--card);color:var(--ink);
    display:none;align-items:center;justify-content:center;
    font-size:clamp(4rem,11vw,6.4rem);font-weight:700;line-height:1;box-shadow:0 9px 0 rgba(0,0,0,.28);}
  .g-letters .lcard{display:flex;}
  .lcard.good{animation:goodkey .3s ease;}
  .lcard.bad{animation:badkey .3s ease;}
  @keyframes goodkey{50%{background:#8be08b;transform:translate(-50%,-50%) scale(1.12);}}
  @keyframes badkey{25%{transform:translate(-50%,-50%) rotate(-7deg);}75%{transform:translate(-50%,-50%) rotate(7deg);}}

  .keys{position:absolute;left:0;right:0;bottom:12px;display:none;gap:10px;justify-content:center;
    flex-wrap:wrap;padding:0 12px;z-index:5;}
  .key{border:none;border-radius:16px;background:var(--card);color:var(--ink);font-family:var(--font);
    font-weight:700;font-size:1.6rem;width:62px;height:62px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);}
  .key:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .dpad{position:absolute;right:14px;bottom:14px;display:none;grid-template-columns:repeat(3,58px);
    grid-template-rows:repeat(2,58px);gap:6px;z-index:5;}
  .dpad .key{width:58px;height:58px;font-size:1.5rem;}
  .dpad .up{grid-column:2;grid-row:1;} .dpad .left{grid-column:1;grid-row:2;}
  .dpad .down{grid-column:2;grid-row:2;} .dpad .right{grid-column:3;grid-row:2;}
  .touch.m-letters .keys{display:flex;}
  .touch.m-arrows .dpad,.touch.m-maze .dpad{display:grid;}


  /* ---------- clicking games ---------- */
  .g-snap{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='60'%20viewBox='0%200%2060%2060'%3E%3Cg%20fill='none'%20stroke='%23000'%20stroke-width='8'%20stroke-linecap='round'%20opacity='.4'%3E%3Cpath%20d='M6%2021V9h12M42%206h12v12M54%2040v12H42M18%2054H6V42'/%3E%3C/g%3E%3Cg%20fill='none'%20stroke='%23fff'%20stroke-width='4.5'%20stroke-linecap='round'%3E%3Cpath%20d='M6%2021V9h12M42%206h12v12M54%2040v12H42M18%2054H6V42'/%3E%3C/g%3E%3Ccircle%20cx='30'%20cy='30'%20r='4'%20fill='%23ff4d4d'%20stroke='%23fff'%20stroke-width='2'/%3E%3Cpath%20d='M30%2018v6M30%2036v6M18%2030h6M36%2030h6'%20stroke='%23fff'%20stroke-width='2.5'%20opacity='.8'/%3E%3C/svg%3E") 30 30, crosshair;}
  .g-mud{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='38'%20height='34'%20viewBox='0%200%2038%2034'%3E%3Crect%20x='2'%20y='3'%20width='34'%20height='28'%20rx='7'%20fill='%23ffd84d'%20stroke='%23c99a12'%20stroke-width='2.5'/%3E%3Crect%20x='2'%20y='21'%20width='34'%20height='10'%20rx='5'%20fill='%237fd4f5'%20stroke='%23c99a12'%20stroke-width='2.5'/%3E%3Ccircle%20cx='12'%20cy='11'%20r='2.6'%20fill='%23e8bd20'%20opacity='.7'/%3E%3Ccircle%20cx='23'%20cy='14'%20r='2.2'%20fill='%23e0b41a'%20opacity='.7'/%3E%3Ccircle%20cx='29'%20cy='8'%20r='1.8'%20fill='%23e0b41a'%20opacity='.7'/%3E%3C/svg%3E") 19 17, pointer;}
  .g-stars{cursor:crosshair;}
  .g-track,.g-pizza{cursor:default;}

  .drawlayer{position:absolute;inset:0;pointer-events:none;display:none;z-index:1;}
  .g-stars .drawlayer{display:block;}
  .drawlayer .link{stroke:#ffe27a;stroke-width:4;stroke-linecap:round;opacity:.95;}
  .drawlayer .antline{stroke:#6b4626;stroke-width:12;stroke-linecap:round;opacity:.55;}
  .g-ants .drawlayer,.g-bugs .drawlayer{display:block;}

  .piecelayer{position:absolute;inset:0;pointer-events:none;z-index:4;}
  .piece{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
    line-height:1;will-change:transform;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));}
  .piece svg{width:100%;height:100%;display:block;}
  .piece.lift{filter:drop-shadow(0 12px 10px rgba(0,0,0,.45)) brightness(1.08);}
  .piece.wrong{animation:badkey .3s ease;}

  .tracklayer{position:absolute;inset:0;display:none;pointer-events:none;z-index:1;}
  .g-track .tracklayer{display:block;}
  .rail{position:absolute;height:30px;
    background:
      linear-gradient(180deg,transparent 0 5px,#8a6a45 5px 10px,transparent 10px 20px,#8a6a45 20px 25px,transparent 25px),
      repeating-linear-gradient(90deg,#c9a06a 0 8px,transparent 8px 22px);}
  .gap{position:absolute;border-radius:6px;background:rgba(0,0,0,.42);
    border:3px dashed rgba(255,255,255,.75);box-sizing:border-box;}
  .gap.filled{display:none;}

  .pizza{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;
    display:none;z-index:1;box-shadow:0 12px 26px rgba(0,0,0,.4);}
  .pizza svg{width:100%;height:100%;display:block;}
  .g-pizza .pizza{display:block;}

  .checklist{position:absolute;left:14px;top:14px;display:none;flex-direction:column;
    align-items:center;gap:6px;z-index:4;background:rgba(0,0,0,.42);
    padding:10px 12px;border-radius:18px;}
  .g-snap .checklist{display:flex;}
  .cl-title{font-size:.82rem;font-weight:600;color:#cfe9ff;line-height:1;margin-bottom:2px;}
  .clitem{font-size:clamp(1.7rem,5.6vmin,2.6rem);line-height:1;
    filter:brightness(0) saturate(0);opacity:.5;transition:filter .25s, opacity .25s, transform .25s;}
  .clitem.got{filter:none;opacity:1;transform:scale(1.12);}

  .order{position:absolute;left:14px;top:14px;display:none;z-index:4;
    flex-direction:column;align-items:center;gap:4px;background:var(--card);color:var(--ink);
    border-radius:18px;padding:8px 14px 10px;box-shadow:0 6px 0 rgba(0,0,0,.28);}
  .g-pizza .order,.g-stars .order{display:flex;}
  .order .otitle{font-size:.85rem;font-weight:600;color:#6d8a7b;line-height:1;}
  .order .orow{display:flex;gap:6px;}
  .order{padding:10px 18px 14px;}
  .order .otitle{font-size:.95rem;}
  .order .orow{gap:10px;align-items:center;}
  .order .oitem{font-size:clamp(2.1rem,7.5vmin,3.3rem);line-height:1;opacity:.3;transition:all .2s;}
  .order .oitem.now{opacity:1;transform:scale(1.25);
    filter:drop-shadow(0 0 8px var(--sun));}
  .order .oitem.done{opacity:.55;filter:grayscale(1);}
  .order .oname{font-size:1.05rem;font-weight:700;}

  .sprite.next .ic{animation:starpulse 1.1s ease-in-out infinite;}
  @keyframes starpulse{0%,100%{transform:scale(1);filter:brightness(1);}
    50%{transform:scale(1.35);filter:brightness(1.6) drop-shadow(0 0 10px #ffe27a);}}

  /* ---------- typing games ---------- */
  .scene{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .digcanvas{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none;z-index:2;}
  .g-dig .digcanvas{display:block;}
  .lt-wrap{position:relative;display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;}
  .lt-emoji{font-size:1em;line-height:1;transition:filter .35s ease;}
  .lt-emoji svg{width:1em;height:1em;display:block;}
  .lt-key{position:absolute;bottom:-16%;right:-12%;background:var(--card);color:var(--ink);
    border-radius:10px;min-width:1.05em;padding:1px 6px;font-size:.46em;font-weight:700;
    line-height:1.25;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:all .2s;}
  .lt-key.hit{background:#7ede86;transform:scale(1.1);}
  .sprite.dark .lt-emoji{filter:brightness(.16) saturate(.2);}
  .sprite.dark .lt-wrap::before{content:"";position:absolute;inset:-22%;border-radius:50%;
    border:4px solid #7fe3ff;animation:sonarping 1.5s ease-out infinite;}
  @keyframes sonarping{0%{transform:scale(.62);opacity:.95;}100%{transform:scale(1.3);opacity:0;}}

  function moveHero(dt, speed, bounds){
    var vx = (held.right?1:0) - (held.left?1:0);
    var vy = (held.down?1:0) - (held.up?1:0);
    if(vx || vy){
      var m = Math.sqrt(vx*vx + vy*vy);
      hx += vx/m*speed*dt; hy += vy/m*speed*dt;
    }
    var b = bounds || {t:0, b:1};
    var r = rect(), pad = heroSize*0.55;
    hx = Math.min(Math.max(hx, pad), r.width - pad);

  }

  /* ================= ARROW GAME: cone drills (football) ================= */
  var cells = [], gn = 5, cell = 0, ox = 0, oy = 0, cx = 0, cy = 0, gx = 0, gy = 0, mazeMoving = false;
  function genMaze(n){
    var c = [], i;
    for(i=0;i<n*n;i++) c.push({n:true,e:true,s:true,w:true,v:false});
    var stack = [0]; c[0].v = true;
    while(stack.length){
      var k = stack[stack.length-1], kx = k%n, ky = Math.floor(k/n), nb = [];
      if(ky>0   && !c[k-n].v) nb.push([k-n,"n","s"]);
      if(kx<n-1 && !c[k+1].v) nb.push([k+1,"e","w"]);
      if(ky<n-1 && !c[k+n].v) nb.push([k+n,"s","n"]);
      if(kx>0   && !c[k-1].v) nb.push([k-1,"w","e"]);
      if(!nb.length){ stack.pop(); continue; }
      var p = nb[Math.floor(Math.random()*nb.length)];
      c[k][p[1]] = false; c[p[0]][p[2]] = false; c[p[0]].v = true; stack.push(p[0]);
    }
    return c;
  }
  function drawMaze(){
    var r = rect();
    cell = Math.min(r.width, r.height)*0.9/gn;
    ox = (r.width - cell*gn)/2; oy = (r.height - cell*gn)/2;
    var cw = Math.max(13, Math.min(cell*0.38, 30));
    var seen = {}, cones = [], lines = [];
    function cone(px, py){
      var k = Math.round(px)+":"+Math.round(py);
      if(seen[k]) return; seen[k] = 1;
      cones.push('<use href="#cone" x="'+(px - cw/2)+'" y="'+(py - cw*0.9)+'" width="'+cw+'" height="'+cw+'"/>');
    }
    var parts = '<defs><symbol id="cone" viewBox="0 0 24 24">'
      + '<ellipse cx="12" cy="20.6" rx="10.5" ry="3.2" fill="#a8380c"/>'
      + '<path d="M12 2.4 L19 20.4 L5 20.4 Z" fill="#ff7d1f"/>'
      + '<path d="M9 11.8 h6 l1.1 3 h-8.2 z" fill="#ffe9d1"/></symbol></defs>';
    parts += '<rect class="target" x="'+(ox+gx*cell+3)+'" y="'+(oy+gy*cell+3)+'" width="'+(cell-6)+'" height="'+(cell-6)+'" rx="8"/>';
    parts += '<path class="post" d="M'+(ox+gx*cell+cell*0.25)+' '+(oy+gy*cell+cell*0.68)
           + ' v-'+(cell*0.36)+' h'+(cell*0.5)+' v'+(cell*0.36)+'"/>';
    parts += '<circle class="startmark" cx="'+(ox+cell*0.5)+'" cy="'+(oy+(gn-0.5)*cell)+'" r="'+(cell*0.36)+'"/>';
    function wall(x0,y0,x1,y1,outer){
      lines.push('<line class="wall" x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y1+'"/>');
      if(outer){ cone(x0,y0); cone((x0+x1)/2,(y0+y1)/2); cone(x1,y1); }
    }
    for(var i=0;i<gn*gn;i++){
      var kx = i%gn, ky = Math.floor(i/gn);
      var x0 = ox + kx*cell, y0 = oy + ky*cell, x1 = x0 + cell, y1 = y0 + cell;
      if(cells[i].n) wall(x0,y0,x1,y0, ky === 0);
      if(cells[i].w) wall(x0,y0,x0,y1, kx === 0);
      if(ky === gn-1 && cells[i].s) wall(x0,y1,x1,y1, true);
      if(kx === gn-1 && cells[i].e) wall(x1,y0,x1,y1, true);
    }
    maze.setAttribute("viewBox", "0 0 "+r.width+" "+r.height);
    maze.innerHTML = parts + lines.join("") + cones.join("");
  }
  function cellCentre(kx, ky){ return { x: ox + (kx+0.5)*cell, y: oy + (ky+0.5)*cell }; }
  var mazeSpin = 0, lastCellKey = "";
  function cellIdxX(v){ return Math.min(Math.max(Math.floor((v-ox)/cell), 0), gn-1); }
  function cellIdxY(v){ return Math.min(Math.max(Math.floor((v-oy)/cell), 0), gn-1); }
  function startMaze(){
    gn = Math.min(5 + 2*score, 13);                // one size per round
    cells = genMaze(gn);
    gx = gn-1; gy = 0; cx = 0; cy = gn-1;
    drawMaze();
    size = Math.max(28, cell*0.54);
    var c = cellCentre(cx, cy);
    ball.classList.remove("gone","ring");
    mazeSpin = 0; lastCellKey = "";
    place(c.x, c.y);
    startLoop();
  }
  function updateMaze(dt){
    var vx = (held.right?1:0) - (held.left?1:0);
    var vy = (held.down?1:0) - (held.up?1:0);
    if(!vx && !vy) return;
    var m = Math.sqrt(vx*vx + vy*vy);
    var speed = Math.max(150, cell*3.3);
    var nx = x + vx/m*speed*dt, ny = y + vy/m*speed*dt;
    var rr = size*0.5 + 3;
    var kx = cellIdxX(x), ky = cellIdxY(y), c = cells[ky*gn + kx];
    var L = ox + kx*cell, R = L + cell, T = oy + ky*cell, B = T + cell;
    if(nx > x && c.e) nx = Math.min(nx, R - rr);
    if(nx < x && c.w) nx = Math.max(nx, L + rr);
    if(ny > y && c.s) ny = Math.min(ny, B - rr);
    if(ny < y && c.n) ny = Math.max(ny, T + rr);
    nx = Math.min(Math.max(nx, ox + rr), ox + cell*gn - rr);
    ny = Math.min(Math.max(ny, oy + rr), oy + cell*gn - rr);
    var dd = Math.sqrt((nx-x)*(nx-x) + (ny-y)*(ny-y));
    mazeSpin += (nx >= x ? 1 : -1)*dd*1.7;
    x = nx; y = ny;
    ball.style.transform = "translate("+(x-size/2)+"px,"+(y-size/2)+"px) rotate("+mazeSpin+"deg)";
    var nkx = cellIdxX(x), nky = cellIdxY(y), key = nkx+","+nky;
    if(key !== lastCellKey){ lastCellKey = key; stepSound(); }
    if(nkx === gx && nky === gy) celebrate("GOAL!");
  }
  /* ================= ARROW GAME: treasure dive (sea) ================= */
  var chestsLeft = 0;
  function startDive(){
    clearEnts();
    var r = rect();
    setHero(DIVER_SVG, Math.min(r.width, r.height)*0.13);
    hx = r.width/2; hy = r.height*0.12; drawHero();
    chestsLeft = 3;
    var m = Math.min(r.width, r.height);
    function freeSpot(minGap, yLo, yHi){
      var px = r.width/2, py = r.height*0.6;
      for(var t=0;t<40;t++){
        px = r.width*(0.12 + Math.random()*0.76);
        py = r.height*(yLo + Math.random()*(yHi - yLo));
        var ok = Math.sqrt((px-hx)*(px-hx) + (py-hy)*(py-hy)) > minGap*2;   // not on the diver
        for(var q=0;q<ents.length && ok;q++){
          var o = ents[q];
          if(o.alive && Math.sqrt((o.x-px)*(o.x-px) + (o.y-py)*(o.y-py)) < minGap) ok = false;
        }
        if(ok) break;
      }
      return {x:px, y:py};
    }
    for(var i=0;i<3;i++){
      var cs = freeSpot(m*0.2, 0.35, 0.9);
      addEnt("🧰", cs.x, cs.y, m*0.1, "chest");
    }
    var jellies = 2 + score;
    for(var j=0;j<jellies;j++){
      var js = freeSpot(m*0.2, 0.3, 0.9);
      var e = addEnt("🪼", js.x, js.y, m*0.095, "jelly");
      var a = Math.random()*Math.PI*2, sp = (45 + score*12)*spd();
      e.vx = Math.cos(a)*sp; e.vy = Math.sin(a)*sp;

  function updateDive(dt){

      var e = ents[i];
      if(!e.alive) continue;
      if(e.kind === "jelly"){
        e.x += e.vx*dt; e.y += e.vy*dt;
        if(e.x < e.r || e.x > r.width - e.r){ e.vx *= -1; e.x = Math.min(Math.max(e.x, e.r), r.width-e.r); }
        if(e.y < r.height*0.22 || e.y > r.height - e.r){ e.vy *= -1; e.y = Math.min(Math.max(e.y, r.height*0.22), r.height-e.r); }
        drawEnt(e);

          hurtHero(); toast("Ouch — back to the top!");

        if(chestsLeft === 0) celebrate("TREASURE!");

    }
  }

  /* ================= ARROW GAME: cross the yard (farm) ================= */
  var lanes = [], rows = 7, rowH = 0, colW = 0, fcol = 3, frow = 6, cols = 7, hopping = false;
  function startCross(){
    clearEnts();
    var r = rect();
    rows = 7; cols = 7;
    rowH = r.height/rows; colW = r.width/cols;
    setHero("🐔", Math.min(rowH, colW)*0.8);
    fcol = 3; frow = rows-1;
    hx = (fcol+0.5)*colW; hy = (frow+0.5)*rowH; drawHero();
    lanes = [];
    var traffic = ["🐑","🚜","🐄","🛻","🐖"];
    var laneRows = [5,4,3,2,1];
    var lvl = score;                               // one step up per crossing
    var laneCount = Math.min(2 + lvl, laneRows.length);
    sceneLayer.innerHTML = "";
    for(var d=0; d<laneCount; d++){                // a dirt track wherever traffic runs
      sceneDiv("left:0;top:"+(laneRows[d]*rowH)+"px;width:100%;height:"+rowH+"px;"
        + "background:linear-gradient(180deg,transparent 0 10%,#b8905e 10% 90%,transparent 90%),"
        + "repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 30px,transparent 30px 70px);", "");
    }
    // fence between the yard and the barn
    sceneDiv("left:0;top:"+(rowH*0.86)+"px;width:100%;height:"+(rowH*0.28)+"px;"
      + "background:repeating-linear-gradient(90deg,#8a6a45 0 9px,transparent 9px 48px),"
      + "linear-gradient(180deg,transparent 22%,#a8865c 22% 40%,transparent 40% 62%,#a8865c 62% 80%,transparent 80%);", "");
    for(var n=0; n<laneCount; n++){
      var row = laneRows[n];
      var dir = row % 2 ? 1 : -1;
      var speed = (30 + Math.random()*16 + lvl*16)*dir*spd();
      var gap = colW*(3.3 + Math.random()*1.2);
      var emoji = traffic[(n + score) % traffic.length];
      var lane = {row:row, speed:speed, items:[]};
      // the lane right in front of the chicken always opens with something in the way
      var offset = (row === 5) ? (hx - gap*Math.ceil(hx/gap)) : (dir > 0 ? 0 : gap/2);
      for(var k=0;k<Math.ceil(r.width/gap)+2;k++){
        var e = addEnt(emoji, offset + k*gap, (row+0.5)*rowH, Math.min(rowH,colW)*0.8, "car");
        e.flip = speed > 0;        // emoji face left, so flip the ones heading right
        drawEnt(e);
        lane.items.push(e);
      }
      lanes.push(lane);
    }
    addEnt(BARN_SVG, r.width/2, rowH*0.5, rowH*0.92, "barn");
    badge.classList.add("on");
    badge.textContent = "Get to the barn";
    startLoop();
  }
  function updateCross(dt){
    var r = rect();
    for(var i=0;i<lanes.length;i++){
      var lane = lanes[i];
      for(var k=0;k<lane.items.length;k++){
        var e = lane.items[k];
        e.x += lane.speed*dt;
        if(lane.speed > 0 && e.x > r.width + e.s) e.x = -e.s;
        if(lane.speed < 0 && e.x < -e.s) e.x = r.width + e.s;

  var gaps = [], trainX = 0, trainSpeed = 0, baseSpeed = 0, trainEnt = null,

      curveOn = false, bendX = 0, curveW = 0, curveY2 = 0, railH = 30;

  function railYAt(px){
    if(!curveOn) return trackY;
    if(px < bendX) return trackY;
    if(px > bendX + curveW) return curveY2;
    var t = (px - bendX)/curveW;
    t = t*t*(3 - 2*t);
    return trackY + (curveY2 - trackY)*t;
  }
  function addRail(x0, x1, yy){
    var el = document.createElement("div");
    el.className = "rail";
    el.style.left = x0+"px";
    el.style.width = (x1-x0)+"px";
    el.style.top = (yy - railH/2)+"px";
    trackLayer.appendChild(el);
  }
  function addGap(gxp, gyp, w, h, type){
    var el = document.createElement("div");
    el.className = "gap";
    el.style.left = (gxp - w/2)+"px";
    el.style.top = (gyp - h/2)+"px";
    el.style.width = w+"px";
    el.style.height = h+"px";
    trackLayer.appendChild(el);
    gaps.push({el:el, x:gxp, y:gyp, w:w, h:h, type:type, filled:false});
  }

  function startTrack(){
    clearEnts(); clearPieces();
    var r = rect();
    hero.classList.remove("on");
    trackLayer.innerHTML = "";
    gaps = []; zoomed = false; trackCrash = false;

    curveOn = score >= 3;                       // curved sections on the last two journeys
    var gapW = Math.max(64, Math.min(r.width*0.11, 110));
    curveW = gapW*1.5;
    trackY = r.height*(curveOn ? 0.66 : 0.56);
    curveY2 = trackY - r.height*0.2;
    bendX = r.width*0.5 - curveW/2;

    var straights = 2 + Math.floor(score/2);
    var slots = [];
    if(curveOn){
      addRail(0, bendX, trackY);
      addRail(bendX + curveW, r.width, curveY2);
      addGap(bendX + curveW/2, (trackY + curveY2)/2, curveW, Math.abs(curveY2-trackY) + railH, "curve");
      // one hole late on the lower run, then the curve, then two up top —
      // a hole right at the start leaves no time to drag a piece into it
      var rightStart = bendX + curveW, rightRun = r.width - rightStart;
      slots.push({x: bendX*0.68, y: trackY});
      slots.push({x: rightStart + rightRun*0.3,  y: curveY2});
      slots.push({x: rightStart + rightRun*0.68, y: curveY2});
    } else {
      addRail(0, r.width, trackY);
      for(var k=0;k<straights;k++)
        slots.push({x: r.width*(0.28 + k*(0.6/straights) + Math.random()*0.04), y: trackY});
    }
    for(var n=0;n<slots.length;n++) addGap(slots[n].x, slots[n].y, gapW, railH, "straight");

    // one spare piece per gap, sized exactly to the hole it fills
    var spares = gaps.slice().sort(function(){ return Math.random()-0.5; });
    for(var q=0;q<spares.length;q++){
      var g = spares[q];
      var html = g.type === "curve" ? curveSVG(Math.round(g.w), Math.round(g.h)) : TRACKPIECE_SVG;
      makePiece(html, r.width*(0.14 + q*0.72/Math.max(spares.length-1,1)), r.height*0.9,
                g.w, g.h, g.type);
    }

    baseSpeed = (62 + score*15)*spd();
    trainSpeed = baseSpeed;
    trainX = -r.width*0.12;
    trainEnt = addEnt("🚂", trainX, trackY, Math.min(r.width, r.height)*0.15, "train");
    trainEnt.flip = true;
    drawEnt(trainEnt);
    badge.classList.add("on");
    badge.textContent = "🚂 " + gaps.length + " to mend";
    startLoop();
  }

  function updateTrack(dt){
    var r = rect();
    if(trackCrash) return;
    var nose = trainX + trainEnt.s*0.42;
    for(var i=0;i<gaps.length;i++){
      var g = gaps[i];
      if(!g.filled && nose >= g.x - g.w*0.45){
        trackCrash = true;
        thudSound();
        toast("The track is broken! Try again.");
        busy = true;
        setTimeout(function(){ busy = false; if(mode === "mouse") nextRound(); }, 1400);
        return;
      }
    }
    trainX += trainSpeed*dt;
    trainEnt.x = trainX;
    trainEnt.y = railYAt(trainX) - trainEnt.s*0.42;
    drawEnt(trainEnt);
    if(trainX > r.width + trainEnt.s) celebrate("ALL ABOARD!");
  }

        g.filled = true; g.el.classList.add("filled");

        } else badge.textContent = "🚂 " + left + " to mend";
        return;
      }
    }
    homePiece(p);
    softSound();
  }

    var r = rect();

    lvRows = 6 + Math.floor(score/2);              // needs depth, or a straight column is likely
    lvCW = r.width/lvCols; lvRH = r.height/lvRows;
    sceneDiv("left:0;top:0;width:100%;height:"+lvRH+"px;background:#6b8a3a;"
      + "border-bottom:6px solid #4d6628;", "");
    sceneDiv("left:0;bottom:0;width:100%;height:"+lvRH+"px;background:#6b8a3a;"
      + "border-top:6px solid #4d6628;", "");

    // if any column happens to run straight up, holding the up arrow would solve it.
    var lanes = lvRows - 2;
    var want = Math.max(2, Math.round(lanes*0.6));     // sideways steps the answer must need
    var taken, path, startCol, attempt = 0;
    while(true){

        var nc = moves[i][0], nr = moves[i][1];

        var key = nc+","+nr;
        if(seen[key]) continue;

  function penaltyRelease(ev){
    aiming = false;

    aimLine.classList.remove("on");
    var r = rect();
    var dx = (ev.clientX - r.left) - x, dy = (ev.clientY - r.top) - y;
    if(Math.sqrt(dx*dx + dy*dy) < 20){ ball.classList.add("ring"); return; }
    var pick = null;
    if(dy < -6){
      var ix = x + dx*((pnNetY - y)/dy);
      for(var i=0;i<pnNets.length;i++)
        if(Math.abs(ix - pnNets[i].x) < pnNets[i].w*0.62) pick = pnNets[i];
    }
    tone(320, 0, .13, "sawtooth", .07);
    ball.classList.remove("ring");
    if(!pick){
      var far = 1.6*Math.max(r.width, r.height)/Math.sqrt(dx*dx + dy*dy);
      penaltyFly(x + dx*far, y + dy*far, false, null);
      return;
    }
    penaltyFly(pick.x, pnNetY, pick.val === pnAnswer, pick);
  }
  function penaltyFly(tx, ty, ok, net){
    busy = true;
    var x0 = x, y0 = y, t0 = performance.now(), spin = (tx > x0 ? 1 : -1)*620;
    var dist = Math.sqrt((tx-x0)*(tx-x0) + (ty-y0)*(ty-y0));
    (function frame(){
      var k = Math.min((performance.now()-t0)/460, 1), e = 1 - Math.pow(1-k, 2.2);
      var px = x0 + (tx-x0)*e, py = y0 + (ty-y0)*e - Math.sin(e*Math.PI)*Math.min(60, dist*0.18);
      x = px; y = py;
      ball.style.transform = "translate("+(px-size/2)+"px,"+(py-size/2)+"px) rotate("+(spin*e)
        + "deg) scale("+(1-0.38*e)+")";
      if(k < 1) requestAnimationFrame(frame);
      else {
        busy = false;
        if(ok){ if(net) net.el.style.background = "rgba(80,220,120,.55)"; celebrate("GOAL!"); }
        else {
          thudSound();
          if(net){ net.el.style.background = "rgba(232,68,58,.5)"; toast("That net is " + net.val + " — try again!"); }

  /* ================= MATHS: ladybird doubles (in the garden, arrow keys) ================= */
  var dblAnswer = 0, dblFlowers = [], dblHome = {x:0, y:0}, dblSpots = 0;

  function ladybirdSVG(spots, showBoth){
    // lay the spots out on the left wing, centred so small counts sit in the middle
    var n = Math.max(1, Math.min(spots, 10));
    var perCol = n <= 4 ? 1 : 2;                         // one column up to four, then two
    var rowsN = Math.ceil(n/perCol);
    var colGap = 13;
    var rowGap = perCol === 1 ? (n <= 3 ? 20 : 19) : (rowsN <= 3 ? 17 : 11.5);
    var midX = 30, midY = 60;                            // middle of the left wing
    var dots = "";
    for(var i=0;i<n;i++){
      var col = i % perCol, row = Math.floor(i/perCol);
      var inThisRow = Math.min(perCol, n - row*perCol);   // centre a short last row
      var cx = midX + (col - (inThisRow-1)/2)*colGap;
      var cy = midY + (row - (rowsN-1)/2)*rowGap;
      dots += '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(perCol === 1 ? 7 : 4.6)
            + '" fill="#1d2126"/>';
    }
    return '<svg viewBox="0 0 100 104" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M36 12 l-10 -9 M64 12 l10 -9" stroke="#1d2126" stroke-width="4.5" stroke-linecap="round"/>'
      + '<circle cx="26" cy="2" r="4" fill="#1d2126"/><circle cx="74" cy="2" r="4" fill="#1d2126"/>'
      + '<ellipse cx="50" cy="58" rx="43" ry="44" fill="#e8443a" stroke="#a8321f" stroke-width="3"/>'
      + dots

          : '<text x="70" y="74" text-anchor="middle" font-family="Fredoka,sans-serif"'
            + ' font-size="44" font-weight="700" fill="#ffd6cf">?</text>')
      + '<path d="M50 20 v78" stroke="#1d2126" stroke-width="5"/>'
      + '<path d="M18 26 a33 25 0 0 1 64 0z" fill="#1d2126"/>'
      + '<circle cx="35" cy="16" r="5" fill="#ffffff"/><circle cx="65" cy="16" r="5" fill="#ffffff"/>'
      + '<circle cx="35" cy="17" r="2.3" fill="#1d2126"/><circle cx="65" cy="17" r="2.3" fill="#1d2126"/></svg>';
  }
  function mirrorDots(n){                      // the same spots again on the other wing

  function startDouble(){

      if(chaseDone >= chaseNeed){ lettersLive = false; celebrate("CAUGHT!"); }
      else newLetter();
    } else {
      lcard.classList.remove("bad"); void lcard.offsetWidth; lcard.classList.add("bad");
      softSound();
    }
  }

  /* ================= keyboard ================= */
  var ARROWS = {ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right",
                w:"up", s:"down", a:"left", d:"right", W:"up", S:"down", A:"left", D:"right"};
  var ARROW_MATHS = {};
  window.addEventListener("keydown", function(ev){
    if(ev.key === "Enter" || ev.key === " "){
      if(!rulesSheet.hidden){ ev.preventDefault(); $("goBtn").click(); return; }
      if(nextBtn.classList.contains("on")){ ev.preventDefault(); nextBtn.click(); return; }
      if(!winSheet.hidden){ ev.preventDefault(); $("againBtn").click(); return; }
    }
    if(!running) return;
    if(mode === "arrows" || ARROW_MATHS[gameKey]){
      var dir = ARROWS[ev.key];
      if(!dir) return;
      ev.preventDefault();
      if(STEPPERS[gameKey]) STEPPERS[gameKey](dir);
      else held[dir] = true;
    } else if(mode === "letters" || mode === "maths"){
      if(ev.key.length === 1 && /[a-z0-9]/i.test(ev.key)) typeKey(ev.key.toUpperCase());
    }
  });
  window.addEventListener("keyup", function(ev){
    var dir = ARROWS[ev.key];
    if(dir) held[dir] = false;
  });
  window.addEventListener("blur", clearHeld);

  Array.prototype.forEach.call(dpad.querySelectorAll("[data-dir]"), function(b){
    var dir = b.getAttribute("data-dir");
    b.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      if(mode !== "arrows" && !ARROW_MATHS[gameKey]) return;
      if(STEPPERS[gameKey]) STEPPERS[gameKey](dir); else held[dir] = true;
    });
    b.addEventListener("pointerup", function(){ held[dir] = false; });
    b.addEventListener("pointerleave", function(){ held[dir] = false; });
  });

  /* ================= navigation ================= */
  var RULES = {
    shoot:  ["⚽","Shoot","Hold the mouse button on the ball. Pull it towards the net. Let go to shoot!"],
    letters:["🔤","Chase","A letter pops up on the card. Press that letter to take a step closer. Keep going and you will always catch him — it just takes more letters each time."],
    maze:   ["🚧","Cone Drills","Hold the arrow keys to roll the ball. Find your way through the cones to the net."],
    dive:   ["🤿","Treasure Dive","Use the arrow keys to swim. Find all three treasure chests. Don't bump the jellyfish!"],
    cross:  ["🚜","Cross the Yard","Press the arrow keys to hop. Wait for a gap, then hop all the way up to the barn."],
    drive:  ["🛣️","Road Trip","Use the arrow keys to steer your car. Go around the cones, cars and oil. Drive to the flag!"],
    dodge:  ["☄️","Asteroid Run","Use the arrow keys to fly your rocket up to the planet. Steer around the falling space rocks — one is coming straight down the middle!"],
    catch:  ["🥣","Catch the Food","The card shows one food. Move the plate with the arrow keys to catch that food. Let the others fall."],
    snap:   ["📷","Deep Sea Snap","Your mouse is a camera! The dark pictures on the left show what to find. Click each one as it swims past."],
    mud:    ["🧽","Muddy Piglets","Your mouse is a sponge! Click every muddy spot to wash the piglets clean."],
    track:  ["🚂","Track Fixer","Bits of track are missing! Drag the spare pieces into the holes before the train gets there."],
    stars:  ["⭐","Constellation Creator","Click the twinkling star. Then click the next one. Join them all to make a picture!"],
    pizza:  ["🍕","Pizza Topper","The card shows the order. Drag each topping onto the pizza in that order."],
    sonar:  ["🔊","Submarine Sonar","Something is hiding in the dark! Type the letter in the ring to send a ping and light it up."],
    feed:   ["🥕","Feed the Animals","The animals are hungry. Each one has a letter. Type it to throw them a snack."],
    toll:   ["🎫","Toll Booth Typer","Cars are waiting. Type the letter or number on the front car's plate to lift the barrier."],
    meteor: ["🛡️","Meteor Defence","Meteors are falling! Each one has a letter. Type it to zap the meteor before it lands."],
    boards: ["🔢","Board Count","Count the boards on the stand. Sensei is going to break some of them — type how many will be left."],
    share:  ["🔢","Share the Leaves","The hungry dinosaurs all want the same number of leaves. Count the pile, then click the basket showing how many they each get."],
    compare:["🔢","More or Fewer","Count the food on both plates, then click the one the card asks for — sometimes more, sometimes fewer."],
    queue:  ["🔢","Car Queue","The cars are all jumbled up. Click them one at a time, starting with the smallest number, to line them up at the toll."],
    seq:    ["🔢","Space Sequence","The planets count up or count down, but one number is missing. Work out what it should be and type it."],
    double: ["🔢","Ladybird Doubles","One wing has spots and the other has a question mark — but both wings always match! Count one wing, then click the flower showing how many spots there are altogether."],
    penalty:["🔢","Penalty Maths","Add the two numbers on the card together. Then pull the ball back with the mouse and shoot it into the net showing the answer!"],
    shoal:  ["🔢","Count the Shoal","Count the fish in each group. Click the group that has the number on the card."],
    eggs:   ["🔢","Egg Boxes","The box needs filling. Count the empty spaces and type that number on the keyboard."],
    ants:   ["🐜","Ant Trail","The ants want to reach the picnic. Hold the mouse button and draw them a path from their nest, then let go and watch them march."],
    bugs:   ["🔤","Bug Sounds","A bug appears with its name underneath, but the first letter is missing. Type the letter that belongs in the gap."],
    crawl:  ["🐛","Caterpillar Crawl","Steer the hungry caterpillar with the arrow keys and eat all the food. You grow longer with every bite, so do not bump into your own tail!"],
    dig:    ["🦴","Fossil Dig","There is a dinosaur buried in the dirt! Hold the mouse button down and sweep it around to brush the dirt away."],
    trail:  ["🐾","Footprint Trail","The footprints spell a word. Type each letter from left to right to walk the dinosaur along the trail."],
    leap:   ["🌋","Lava Leap","Find the stepping stones that lead all the way across. Hop from stone to stone with the arrow keys."],
    board:  ["💥","Board Breaker","Hold the mouse button down to build up power. Let go when the bar is on the green part to smash the board!"],
    kata:   ["🧠","Kata Caller","Read the move word on the cards. When they flip over, type the word back from memory."],
    pads:   ["🦶","Pad Kicks","One pad lights up at a time. Press the arrow key that points at it to kick!"],
    soup:   ["🍲","Soup Speller","The card shows a word. Type each letter in order to drop that ingredient in the pot."]
  };
  function track(name, data){
    try{ if(window.va) window.va("event", {name:name, data:data||{}}); }catch(e){}
  }
  // Custom events need a paid plan, but page views are counted per URL path on every
  // plan — so give each screen its own path and they show up in the Pages panel.
  function pageAs(path){
    try{
      if(location.pathname === path) return;
      history.pushState({}, "", path);
      if(window.va) window.va("pageview", {route:path, path:path});
    }catch(e){}
  }
  function showRules(key){
    var rl = RULES[key] || ["🎮","Ready?","Have fun!"];
    rulesEmoji.textContent = rl[0];
    rulesTitle.textContent = rl[1];
    rulesText.textContent = rl[2];
    rulesSheet.hidden = false;
    setTimeout(function(){ try{ $("goBtn").focus(); }catch(e){} }, 30);
  }
  $("goBtn").addEventListener("click", function(){
    rulesSheet.hidden = true;
    running = true;
    track("game_start", {theme: theme ? theme.id : "", game: gameKey, speed: save.speed});
    pageAs("/play/" + (theme ? theme.id : "x") + "/" + gameKey + "/" + save.speed);
    pickSound();
    nextRound();
  });

  function gameKeysFor(t){
    var keys = t.id === "football" ? ["shoot","letters","maze"]
                                   : [t.mouse.key, t.letters.key, t.arrows.key];
    if(t.maths) keys.push(t.maths.key);
    return keys;
  }
  function wonKey(t, key, speed){ return bestKey(t.id, key) + ":" + (speed || save.speed); }
  function isWon(t, key, speed){ return !!save.won[wonKey(t, key, speed)]; }
  function buildTiles(){
    tiles.innerHTML = "";
    THEMES.forEach(function(t){
      var b = document.createElement("button");
      b.className = "tile";
      var stars = "";
      gameKeysFor(t).forEach(function(k){ stars += '<i class="'+(isWon(t,k) ? "lit" : "")+'">⭐</i>'; });
      b.innerHTML = '<span class="emoji">'+t.emoji+'</span><span class="label">'+t.name+'</span>'
                  + '<span class="stars">'+stars+'</span>';
      b.addEventListener("click", function(){ openTheme(t); });
      tiles.appendChild(b);
    });
  }
  function paintQuest(){
    var total = 0, slow = 0, fast = 0;
    THEMES.forEach(function(t){ gameKeysFor(t).forEach(function(k){
      total++;
      if(isWon(t,k,"easy")) slow++;
      if(isWon(t,k,"normal")) fast++;
    }); });
    var el = $("questDone"), cur = save.speed === "easy" ? slow : fast;
    if(slow >= total && fast >= total) el.textContent = "🏆 Every star on both speeds — the whole quest!";
    else if(cur >= total) el.textContent = (save.speed === "easy" ? "🐢" : "🐆") + " Quest complete on this speed!";
    el.classList.toggle("on", cur >= total);
  }
  buildTiles();

  function paintSegs(){
    Array.prototype.forEach.call(document.querySelectorAll("#speedSeg button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-speed") === save.speed);
    });
    Array.prototype.forEach.call(document.querySelectorAll("#caseSeg button"), function(b){
      b.classList.toggle("active", b.getAttribute("data-case") === save.letters);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#speedSeg button"), function(b){
    b.addEventListener("click", function(){
      save.speed = b.getAttribute("data-speed"); store(); paintSegs(); buildTiles(); paintQuest(); pickSound();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("#caseSeg button"), function(b){
    b.addEventListener("click", function(){ save.letters = b.getAttribute("data-case"); store(); paintSegs(); pickSound(); });
  });
  paintSegs();

  function modeCard(emoji, name, how, won, enabled, onClick){
    var b = document.createElement("button");
    b.className = "mode";
    b.innerHTML = '<span class="emoji">'+emoji+'</span><span class="name">'+name+'</span>'
      + '<span class="how">'+how+'</span>'
      + '<span class="best">'+(enabled ? (won ? "⭐ Done!" : "") : "Coming soon")+'</span>';
    if(!enabled) b.disabled = true;
    else b.addEventListener("click", onClick);
    return b;
  }

  function openTheme(t){
    theme = t;
    stopLoop();
    resetField();
    field.setAttribute("data-bg", t.bg);
    paintBackdrop();
    if(curTrackId !== t.id) setTrack(t.id);
    pageAs("/theme/" + t.id);
    themeTitle.textContent = t.name;
    themeModes.innerHTML = "";
    var isFootball = t.id === "football";
    if(isFootball){
      themeModes.appendChild(modeCard("🖱️", "Shoot", "Mouse",
        isWon(t,"shoot"), true, function(){ startGame("shoot","shoot",10); }));
    } else {
      var mg = t.mouse;
      themeModes.appendChild(modeCard(mg.emoji, mg.name, "Mouse",
        isWon(t,mg.key), true, function(){ startGame("mouse", mg.key, mg.target); }));
    }
    if(isFootball){
      themeModes.appendChild(modeCard("🔤", "Chase", "Letter keys",
        isWon(t,"letters"), true, function(){ startGame("letters","letters",5); }));
    } else {
      var lg = t.letters;
      themeModes.appendChild(modeCard(lg.emoji, lg.name, "Letter keys",
        isWon(t,lg.key), true, function(){ startGame("letters", lg.key, lg.target); }));
    }
    var a = t.arrows;
    themeModes.appendChild(modeCard(a.emoji, a.name, "Arrow keys",
      isWon(t,a.key), true, function(){ startGame("arrows", a.key, a.target); }));
    if(t.maths){
      var mathsG = t.maths;
      themeModes.appendChild(modeCard(mathsG.emoji, mathsG.name, "Numbers",
        isWon(t,mathsG.key), true, function(){ startGame("maths", mathsG.key, mathsG.target); }));
    }
    // printable worksheets for this theme, if any have been added to the repo
    themeSheets.innerHTML = "";
    var sheets = PRINTABLES[t.id] || [];
    if(sheets.length){
      var lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = "Print at home:";
      themeSheets.appendChild(lbl);
      sheets.forEach(function(kind){
        var meta = SHEET_META[kind] || ["📄", kind];
        var link = document.createElement("a");
        link.className = "sheet-btn";
        link.href = "/printables/" + t.id + "/" + kind + ".pdf";
        link.target = "_blank";
        link.rel = "noopener";
        link.innerHTML = '<span>'+meta[0]+'</span><span>'+meta[1]+'</span>';
        themeSheets.appendChild(link);
      });
    }
    homeSheet.hidden = true; winSheet.hidden = true;
    themeSheet.hidden = false;
    backBtn.hidden = false;
    hint.textContent = "";
    tallyNum.textContent = "";
    pips.innerHTML = "";
    pickSound();
  }

  function startGame(m, key, tgt){
    mode = m; gameKey = key; target = tgt;
    field.className = "field" + (coarse ? " touch" : "");
    field.classList.add(m === "arrows" && key === "maze" ? "m-maze" : "m-"+m);
    if(m === "arrows") field.classList.add("m-arrows");
    field.classList.add("g-"+key);
    field.setAttribute("data-bg", BG_OVERRIDE[key] || theme.bg);
    paintBackdrop();
    shootLevel = -1; keeperX = 0; keeperDir = 1; defX = 0; defDir = 1;
    lettersLive = false; aiming = false; busy = false; mazeMoving = false; hopping = false;
    setScore(0);
    themeSheet.hidden = true; winSheet.hidden = true;
    backBtn.hidden = false;
    hint.textContent = (m === "arrows") ? theme.arrows.hint
      : (m === "maths") ? theme.maths.hint
      : (m === "mouse") ? theme.mouse.hint
      : (m === "letters" && theme.letters) ? theme.letters.hint
      : (m === "shoot" ? "Pull the ball towards the net with the mouse and let go. 10 goals wins."
                       : "Press the letter on the card to close in on him. 5 catches wins.");
    clearEnts(); clearPieces();
    sceneLayer.innerHTML = ""; trackLayer.innerHTML = ""; drawLayer.innerHTML = "";
    orderEl.innerHTML = ""; checklist.innerHTML = "";
    ball.classList.add("gone"); ball.classList.remove("ring");
    aimLine.classList.remove("on");
    keeper.classList.remove("on"); defender.classList.remove("on"); chaser.classList.remove("on");
    runner.classList.remove("on"); stopper.classList.remove("on");
    hero.classList.remove("on","frozen"); badge.classList.remove("on");
    foodCard.classList.remove("on","got"); roadlines.classList.remove("on");
    nextBtn.classList.remove("on");
    running = false;
    showRules(key);
  }

  function resetField(){
    stopLoop(); clearHeld(); clearEnts(); clearPieces();
    running = false; rulesSheet.hidden = true; nextBtn.classList.remove("on");
    trackLayer.innerHTML = ""; drawLayer.innerHTML = ""; sceneLayer.innerHTML = "";
    gauge.style.display = ""; tollCars = []; sonarTarget = null;
    orderEl.innerHTML = ""; orderEl.style.display = "";
    checklist.innerHTML = "";
    pigs = []; gaps = []; starEnts = [];
    mode = null; gameKey = null; target = 0;
    busy = false; aiming = false; lettersLive = false; mazeMoving = false; hopping = false;
    field.className = "field" + (coarse ? " touch" : "");
    ball.classList.add("gone"); ball.classList.remove("ring");
    aimLine.classList.remove("on");
    keeper.classList.remove("on"); defender.classList.remove("on"); chaser.classList.remove("on");
    runner.classList.remove("on"); stopper.classList.remove("on");
    hero.classList.remove("on"); badge.classList.remove("on");
    foodCard.classList.remove("on","got"); roadlines.classList.remove("on");
    hero.classList.remove("frozen"); catchFreeze = 0; driveFreeze = 0; dodgeFreeze = 0;
    heroRot = 0;
    goal.style.width = "46%"; maze.innerHTML = "";
    shootLevel = -1;
  }

  function toHome(){
    resetField();
    theme = null;
    field.setAttribute("data-bg", "home");
    paintBackdrop();
    if(curTrackId !== "home") setTrack("home");
    homeSheet.hidden = false; themeSheet.hidden = true; winSheet.hidden = true;
    backBtn.hidden = true;
    tallyNum.textContent = ""; pips.innerHTML = "";
    hint.textContent = "";
    resetClearBtn();
    buildTiles(); paintQuest(); paintSegs();
    pageAs("/");
  }

  backBtn.addEventListener("click", function(){
    if(!themeSheet.hidden || !winSheet.hidden || mode === null) toHome();
    else { var t = theme; resetField(); openTheme(t); }
  });
  $("againBtn").addEventListener("click", function(){
    var t = wonTheme, m = wonMode, k = gameKey, tg = target;
    winSheet.hidden = true;
    theme = t;
    startGame(m, k, tg);
  });
  $("menuBtn").addEventListener("click", function(){ var t = wonTheme; resetField(); openTheme(t); });

  /* ---------- keep stray mouse clicks from leaving the game ----------
     The side buttons on a mouse fire as button 3 and 4. Blocking those helps, but it
     is not reliable in every browser, so the history is also kept topped up: any back
     or forward navigation is caught, cancelled, and turned into the app's own Back. */
  function appBack(){
    if(mode){                                   // in a game → back to the theme screen
      var t = theme;
      resetField();
      if(t) openTheme(t); else toHome();
    } else if(!winSheet.hidden || !themeSheet.hidden){
      toHome();                                 // on a theme or win screen → home
    }
    // already home: stay put
  }
  function guardHistory(){
    try{ history.pushState({cq:1}, "", location.pathname + location.search); }catch(e){}
  }
  window.addEventListener("popstate", function(){
    guardHistory();                             // put the entry back so they never leave
    appBack();
  });
  ["mousedown","mouseup","auxclick"].forEach(function(evt){
    window.addEventListener(evt, function(ev){
      if(ev.button === 3 || ev.button === 4){ ev.preventDefault(); ev.stopPropagation(); }
    }, true);
  });
  window.addEventListener("keydown", function(ev){
    if(ev.key === "Backspace"){                 // no stray backspace navigation either
      var t = ev.target && ev.target.tagName;
      if(t !== "INPUT" && t !== "TEXTAREA") ev.preventDefault();
    }
  }, true);
  guardHistory();

  window.addEventListener("resize", function(){
    paintBackdrop();
    if(!mode || busy) return;
    var r = rect();
    if(gameKey === "maze"){
      var fx = (x - ox)/(cell*gn), fy = (y - oy)/(cell*gn);
      drawMaze();
      size = Math.max(28, cell*0.54);
      place(ox + fx*cell*gn, oy + fy*cell*gn);
    } else if(gameKey === "cross"){
      rowH = r.height/rows; colW = r.width/cols;
      hx = (fcol+0.5)*colW; hy = (frow+0.5)*rowH; drawHero();
    } else if(mode === "letters"){
      lineY = r.height*0.18; runX = r.width*0.38; stopX = r.width*0.62;
      placeAt(runner, runX, runY); placeAt(stopper, stopX, stopY); placeRunBall();
    }
  });

  toHome();
})();
</script>
</body>
</html>
